<aside class="sidebar">

  <div class="brand">
    <div class="brand-logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="9" r="9" fill="white" fill-opacity="0.15" />
        <path d="M5 13L7.5 6L9 10L10.5 7.5L13 13" stroke="white" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </div>
    <div class="brand-text">
      <strong>Sales CRM</strong>
      <span>AI + n8n</span>
    </div>
  </div>

  <nav class="sidebar-nav">

    <!-- Dashboard -->
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
        <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
        <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
        <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
      </svg>

      <span>Dashboard</span>
    </a>


    <!-- Leads -->
    <a routerLink="/leads" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="7" r="3.25" stroke="currentColor" stroke-width="1.5" />

        <path d="M2 17c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" />

        <path d="M14 9.5a2.5 2.5 0 0 0 0-5M18 17c0-2.5-1.5-4-4-4" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" />
      </svg>

      <span>Leads</span>
    </a>


    <!-- AI -->
    <a routerLink="/ai-test" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">✦</span>
      <span>AI Test</span>
    </a>


    <!-- Workflows -->
    <a routerLink="/workflows" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="10" r="2.25" stroke="currentColor" stroke-width="1.5" />

        <circle cx="16" cy="4" r="2.25" stroke="currentColor" stroke-width="1.5" />

        <circle cx="16" cy="16" r="2.25" stroke="currentColor" stroke-width="1.5" />

        <path d="M6.25 10h3.5L13.75 4.5M6.25 10l3.5 0 4-5.5M9.75 10l4 5.5" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" />
      </svg>

      <span>Workflows</span>
    </a>


    <!-- Email -->
    <a routerLink="/email-test" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="5" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5" />

        <path d="M2 8l8 5 8-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>

      <span>Email Test</span>
    </a>

  </nav>

  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar">C</div>
      <span class="user-name">AI CRM</span>
    </div>
  </div>

</aside>


<main class="main-content">

  <header class="topbar">

    <div class="topbar-left">
      <h1>Sales CRM</h1>
      <span>AI-powered sales automation</span>
    </div>

    <a routerLink="/leads/new" class="new-lead-btn">
      + New lead
    </a>

  </header>

  <section class="page-content">
    <router-outlet></router-outlet>
  </section>

</main>
