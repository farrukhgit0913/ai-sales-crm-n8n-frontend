
<aside class="sidebar">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">
      <svg
        width="38"
        height="38"
        viewBox="0 0 40 40"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="LeadPilot AI logo"
      >
        <rect width="40" height="40" rx="12" fill="#172B4D" />

        <path
          d="M10 27L17 20L23 23L31 12"
          stroke="#5DE0D0"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <circle cx="10" cy="27" r="3" fill="#FFFFFF" />
        <circle cx="17" cy="20" r="3" fill="#5DE0D0" />
        <circle cx="23" cy="23" r="3" fill="#FFFFFF" />
        <circle cx="31" cy="12" r="3.5" fill="#5DE0D0" />

        <path
          d="M25 12H31V18"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="brand-text">
      <strong>LeadPilot AI</strong>
      <span>Intelligent Sales Automation</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="7" height="7" rx="1.5"
          stroke="currentColor" stroke-width="1.5" />
        <rect x="11" y="2" width="7" height="7" rx="1.5"
          stroke="currentColor" stroke-width="1.5" />
        <rect x="2" y="11" width="7" height="7" rx="1.5"
          stroke="currentColor" stroke-width="1.5" />
        <rect x="11" y="11" width="7" height="7" rx="1.5"
          stroke="currentColor" stroke-width="1.5" />
      </svg>

      <span>Dashboard</span>
    </a>

    <!-- Leads -->
    <a
      routerLink="/leads"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="7" r="3.25"
          stroke="currentColor" stroke-width="1.5" />
        <path
          d="M2 17c0-3.314 2.686-5 6-5s6 1.686 6 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          d="M14 9.5a2.5 2.5 0 0 0 0-5M18 17c0-2.5-1.5-4-4-4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>

      <span>Leads</span>
    </a>

    <!-- AI Assistant -->
    <a
      routerLink="/ai-test"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M10 2.5L12 7.5L17.5 10L12 12L10 17.5L8 12L2.5 10L8 7.5L10 2.5Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>

      <span>AI Assistant</span>
    </a>

    <!-- Workflows -->
    <a
      routerLink="/workflows"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <circle cx="4" cy="10" r="2.25"
          stroke="currentColor" stroke-width="1.5" />
        <circle cx="16" cy="4" r="2.25"
          stroke="currentColor" stroke-width="1.5" />
        <circle cx="16" cy="16" r="2.25"
          stroke="currentColor" stroke-width="1.5" />
        <path
          d="M6.25 10h3.5L13.75 4.5M6.25 10h3.5l4 6"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>Workflows</span>
    </a>

    <!-- Email -->
    <a
      routerLink="/email-test"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="5" width="16" height="12" rx="2"
          stroke="currentColor" stroke-width="1.5" />
        <path
          d="M2 8l8 5 8-5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>

      <span>Email Integration</span>
    </a>

  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" aria-hidden="true">L</div>

      <div class="user-info">
        <span class="user-name">LeadPilot AI</span>
        <span class="user-role">Sales Intelligence</span>
      </div>
    </div>
  </div>

</aside>

<!-- Main Content -->
<main class="main-content">

  <header class="topbar">

    <div class="topbar-left">
      <h1>LeadPilot AI</h1>
      <span>Intelligent Sales Automation</span>
    </div>

    <a routerLink="/leads/new" class="new-lead-btn">
      + New Lead
    </a>

  </header>

  <section class="page-content">
    <router-outlet></router-outlet>
  </section>

</main>
