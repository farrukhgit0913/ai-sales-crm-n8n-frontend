<div class="auth-page">
  <div class="auth-card">
    <div class="brand-wrapper">
      <a routerLink="/dashboard" class="brand">
        <div class="brand-logo">
          <svg
            width="38"
            height="38"
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="LeadPilot AI logo"
          >
            <rect width="40" height="40" rx="12" fill="#172B4D" />

            <path
              d="M10 27L17 20L23 23L31 12"
              stroke="#5DE0D0"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <circle cx="10" cy="27" r="3" fill="#FFFFFF" />
            <circle cx="17" cy="20" r="3" fill="#5DE0D0" />
            <circle cx="23" cy="23" r="3" fill="#FFFFFF" />
            <circle cx="31" cy="12" r="3.5" fill="#5DE0D0" />

            <path
              d="M25 12H31V18"
              stroke="#FFFFFF"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <span class="brand-text">LeadPilot <strong>AI</strong></span>
      </a>
    </div>

    <div class="auth-heading">
      <h1>Welcome back</h1>
      <p>Sign in to manage your leads and grow your business.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #signinForm="ngForm" novalidate>
      <div class="form-group" [class.has-error]="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched || signinForm.submitted)">
        <label for="email">Work email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            #emailCtrl="ngModel"
            placeholder="you@company.com"
            autocomplete="email"
            required
            email
          />
        </div>
        <div *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched || signinForm.submitted)" class="error-message">
          <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
          <span *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <div class="form-group" [class.has-error]="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched || signinForm.submitted)">
        <div class="label-row">
          <label for="password">Password</label>
          <a routerLink="/forgot-password" class="text-link">Forgot password?</a>
        </div>

        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            #passwordCtrl="ngModel"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="password-footer-row">
          <label class="show-password">
            <input
              type="checkbox"
              [(ngModel)]="showPassword"
              name="showPassword"
            />
            <span>Show password</span>
          </label>

          <div *ngIf="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched || signinForm.submitted)" class="error-message">
            Password is required.
          </div>
        </div>
      </div>

      <button type="submit" [disabled]="signinForm.invalid && signinForm.submitted">
        <span class="btn-text">Sign in</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="auth-divider">
      <span>or</span>
    </div>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/signup">Create an account</a>
    </p>
  </div>
</div>
