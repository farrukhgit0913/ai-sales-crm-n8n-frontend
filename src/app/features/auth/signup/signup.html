<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/dashboard" class="brand">
      <span class="brand-icon">L</span>
      <span>LeadPilot <strong>AI</strong></span>
    </a>

    <div class="auth-heading">
      <h1>Create your account</h1>
      <p>Start managing leads smarter with AI-powered insights.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Your full name"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Work email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@company.com"
          autocomplete="email"
          required
          email
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          autocomplete="new-password"
          required
          minlength="8"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
          required
          minlength="8"
          [class.invalid]="
            confirmPassword && password !== confirmPassword
          "
        />

        <small
          class="error-message"
          *ngIf="confirmPassword && password !== confirmPassword"
        >
          Passwords do not match.
        </small>

        <label class="show-password">
          <input
            type="checkbox"
            [(ngModel)]="showPassword"
            name="showPassword"
            (change)="confirmPassword = confirmPassword"
          />
          Show password
        </label>
      </div>

      <button
        type="submit"
        [disabled]="signupForm.invalid || password !== confirmPassword"
      >
        Create account
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/signin">Sign in</a>
    </p>
  </div>
</div>
