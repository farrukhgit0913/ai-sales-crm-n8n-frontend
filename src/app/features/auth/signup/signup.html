<div class="auth-page">
  <div class="auth-card">

    <!-- Brand -->
    <div class="brand-wrapper">
      <a routerLink="/dashboard" class="brand" aria-label="LeadPilot AI home">
        <div class="brand-logo">
          <img src="logo.svg" alt="LeadPilot AI logo" width="38" height="38" />
        </div>

        <span class="brand-text">LeadPilot <strong>AI</strong></span>
      </a>
    </div>

    <!-- Page heading -->
    <header class="auth-heading">
      <h1>Create your account</h1>
    </header>

    <!-- Signup form -->
    <form
      (ngSubmit)="onSubmit()"
      #signupForm="ngForm"
      novalidate
    >
      <!-- Full name -->
      <div
        class="form-group"
        [class.has-error]="nameCtrl.invalid && (nameCtrl.dirty || nameCtrl.touched || signupForm.submitted)"
      >
        <label for="name">Full name</label>

        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>

          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="name"
            #nameCtrl="ngModel"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          />
        </div>

        <div
          *ngIf="nameCtrl.invalid && (nameCtrl.dirty || nameCtrl.touched || signupForm.submitted)"
          class="error-message"
        >
          Full name is required.
        </div>
      </div>

      <!-- Email -->
      <div
        class="form-group"
        [class.has-error]="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched || signupForm.submitted)"
      >
        <label for="email">Work email</label>

        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
          </span>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            #emailCtrl="ngModel"
            placeholder="you@company.com"
            autocomplete="email"
            required
            email
          />
        </div>

        <div
          *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched || signupForm.submitted)"
          class="error-message"
        >
          <span *ngIf="emailCtrl.errors?.['required']">
            Email is required.
          </span>
          <span *ngIf="emailCtrl.errors?.['email']">
            Enter a valid email address.
          </span>
        </div>
      </div>

      <!-- Password -->
      <div
        class="form-group"
        [class.has-error]="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched || signupForm.submitted)"
      >
        <label for="password">Password</label>

        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
          </span>

          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            #passwordCtrl="ngModel"
            placeholder="Create a strong password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        <div class="password-footer-row">
          <label class="show-password">
            <input
              type="checkbox"
              [(ngModel)]="showPassword"
              name="showPassword"
            />
            <span>Show password</span>
          </label>

          <span class="password-hint">8+ characters</span>
        </div>

        <div
          *ngIf="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched || signupForm.submitted)"
          class="error-message"
        >
          <span *ngIf="passwordCtrl.errors?.['required']">
            Password is required.
          </span>
          <span *ngIf="passwordCtrl.errors?.['minlength']">
            Use at least 8 characters.
          </span>
        </div>
      </div>

      <!-- Confirm password -->
      <div
        class="form-group"
        [class.has-error]="(confirmPasswordCtrl.invalid && (confirmPasswordCtrl.dirty || confirmPasswordCtrl.touched || signupForm.submitted)) || (!!confirmPassword && password !== confirmPassword)"
      >
        <label for="confirmPassword">Confirm password</label>

        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              <path d="m9 16 2 2 2 2 4-5" />
            </svg>
          </span>

          <input
            id="confirmPassword"
            [type]="showPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            #confirmPasswordCtrl="ngModel"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        <div
          *ngIf="confirmPasswordCtrl.invalid && (confirmPasswordCtrl.dirty || confirmPasswordCtrl.touched || signupForm.submitted)"
          class="error-message"
        >
          <span *ngIf="confirmPasswordCtrl.errors?.['required']">
            Please confirm your password.
          </span>
          <span *ngIf="confirmPasswordCtrl.errors?.['minlength']">
            Use at least 8 characters.
          </span>
        </div>

        <div
          *ngIf="!confirmPasswordCtrl.invalid && confirmPassword && password !== confirmPassword"
          class="error-message"
        >
          Passwords do not match.
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="signupForm.invalid || password !== confirmPassword"
      >
        <span>Create account</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>

          <!-- Top navigation -->
    <div class="auth-top-link">
      <span>Already have an account?</span>
      <a routerLink="/signin">Sign in</a>
    </div>
    </form>
  </div>
</div>
