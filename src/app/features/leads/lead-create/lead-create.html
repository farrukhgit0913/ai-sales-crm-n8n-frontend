<div class="lead-create-page">

  <div class="page-header">

    <div>
      <a
        routerLink="/leads"
        class="back-link"
      >
        ← Back to Leads
      </a>

      <h1>Create Lead</h1>

      <p>
        Add a new sales lead to your CRM.
      </p>
    </div>

  </div>

  @if (error()) {
    <div class="error-message">
      {{ error() }}
    </div>
  }

  @if (success()) {
    <div class="success-message">
      {{ success() }}
    </div>
  }

  <div class="form-card">

    <div class="form-grid">

      <!-- Name -->

      <div class="form-group">

        <label for="name">
          Name *
        </label>

        <input
          id="name"
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          placeholder="Lead name"
        />

      </div>


      <!-- Company -->

      <div class="form-group">

        <label for="company">
          Company
        </label>

        <input
          id="company"
          type="text"
          [ngModel]="company()"
          (ngModelChange)="company.set($event)"
          placeholder="Company name"
        />

      </div>


      <!-- Email -->

      <div class="form-group">

        <label for="email">
          Email *
        </label>

        <input
          id="email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="Email address"
        />

      </div>


      <!-- Phone -->

      <div class="form-group">

        <label for="phone">
          Phone
        </label>

        <input
          id="phone"
          type="text"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
          placeholder="Phone number"
        />

      </div>


      <!-- Budget -->

      <div class="form-group">

        <label for="budget">
          Budget
        </label>

        <input
          id="budget"
          type="number"
          [ngModel]="budget()"
          (ngModelChange)="
            budget.set(
              $event === ''
                ? null
                : +$event
            )
          "
          placeholder="Budget"
        />

      </div>


      <!-- Status -->

      <div class="form-group">

        <label for="status">
          Status
        </label>

        <select
          id="status"
          [ngModel]="status()"
          (ngModelChange)="status.set($event)"
        >

          <option value="new">
            New
          </option>

          <option value="contacted">
            Contacted
          </option>

          <option value="qualified">
            Qualified
          </option>

          <option value="proposal">
            Proposal
          </option>

          <option value="negotiation">
            Negotiation
          </option>

          <option value="won">
            Won
          </option>

          <option value="lost">
            Lost
          </option>

        </select>

      </div>

    </div>


    <!-- Requirement -->

    <div class="form-group">

      <label for="requirement">
        Requirement
      </label>

      <textarea
        id="requirement"
        rows="6"
        [ngModel]="requirement()"
        (ngModelChange)="requirement.set($event)"
        placeholder="Customer requirement..."
      ></textarea>

    </div>


    <!-- Actions -->

    <div class="form-actions">

      <button
        type="button"
        class="secondary-btn"
        (click)="cancel()"
        [disabled]="saving()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="primary-btn"
        (click)="createLead()"
        [disabled]="saving()"
      >

        @if (saving()) {
          Creating...
        } @else {
          Create Lead
        }

      </button>

    </div>

  </div>

</div>
