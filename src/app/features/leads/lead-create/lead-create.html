<div class="lead-create-page">

  <div class="page-header">

    <a routerLink="/leads" class="back-link">
      ← Back to leads
    </a>

    <h1>Create lead</h1>

    <p>Add a new sales lead to your pipeline.</p>

  </div>


  @if (error()) {
    <div class="error-message">
      {{ error() }}
    </div>
  }

  @if (success()) {
    <div class="success-message">
      {{ success() }}
    </div>
  }


  <div class="form-card">

    <div class="form-grid">

      <div class="form-group">
        <label for="name">Name <span class="required">*</span></label>
        <input
          id="name"
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          placeholder="Full name"
        />
      </div>

      <div class="form-group">
        <label for="company">Company</label>
        <input
          id="company"
          type="text"
          [ngModel]="company()"
          (ngModelChange)="company.set($event)"
          placeholder="Company name"
        />
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input
          id="email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="name@company.com"
        />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input
          id="phone"
          type="text"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
          placeholder="+1 (555) 000-0000"
        />
      </div>

      <div class="form-group">
        <label for="budget">Budget</label>
        <input
          id="budget"
          type="number"
          [ngModel]="budget()"
          (ngModelChange)="budget.set($event === '' ? null : +$event)"
          placeholder="0"
        />
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select
          id="status"
          [ngModel]="status()"
          (ngModelChange)="status.set($event)"
        >
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option>
          <option value="proposal">Proposal</option>
          <option value="negotiation">Negotiation</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
      </div>

    </div>


    <div class="form-group">
      <label for="requirement">Requirement</label>
      <textarea
        id="requirement"
        rows="5"
        [ngModel]="requirement()"
        (ngModelChange)="requirement.set($event)"
        placeholder="Describe what the customer is looking for…"
      ></textarea>
    </div>


    <div class="form-actions">

      <button
        type="button"
        class="secondary-btn"
        (click)="cancel()"
        [disabled]="saving()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="primary-btn"
        (click)="createLead()"
        [disabled]="saving()"
      >
        {{ saving() ? 'Creating…' : 'Create lead' }}
      </button>

    </div>

  </div>

</div>
